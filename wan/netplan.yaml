# /etc/netplan/10-lab-wan.yaml — lab-wan: тестовый «внешний» хост в host-only сети.
# Маршруты во внутренние сети указывают на gw, как сделал бы атакующий в сегменте
# провайдера — так проверяется, что firewall режет WAN → LAN/DMZ, а не отсутствие маршрута.
network:
  version: 2
  renderer: networkd
  ethernets:
    ext:
      match: {macaddress: "08:00:27:aa:06:01"}
      addresses: [192.168.56.20/24]
      routes:
        - to: 192.168.10.0/24
          via: 192.168.56.10
        - to: 172.16.20.0/24
          via: 192.168.56.10
      link-local: []
