# /etc/dnsmasq.d/lab.conf — lab-gw: DHCP + кеширующий DNS только для LAN

# Слушать только LAN. bind-dynamic: не мешает systemd-resolved на 127.0.0.53
# и переживает появление интерфейса позже старта dnsmasq.
interface=lan0
bind-dynamic
except-interface=lo

# DNS: апстримы — те, что gw получил по DHCP на wan0 (через systemd-resolved)
resolv-file=/run/systemd/resolve/resolv.conf
domain-needed
bogus-priv
domain=lab.local
local=/lab.local/
expand-hosts
cache-size=1000

# DHCP: пул .100–.200, маска, шлюз, DNS
dhcp-range=lan0,192.168.10.100,192.168.10.200,255.255.255.0,12h
dhcp-option=lan0,option:router,192.168.10.1
dhcp-option=lan0,option:dns-server,192.168.10.1
dhcp-option=lan0,option:domain-name,lab.local
dhcp-authoritative
log-dhcp
