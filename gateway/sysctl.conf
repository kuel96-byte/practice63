# /etc/sysctl.d/99-lab-gw.conf — lab-gw
# Маршрутизация между зонами
net.ipv4.ip_forward = 1

# Anti-spoofing: strict reverse path filtering.
# Маска «*» нужна, т.к. /usr/lib/sysctl.d/50-default.conf ставит rp_filter=2
# для каждого интерфейса, а действует max(all, iface).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.*.rp_filter = 1
net.ipv4.conf.all.log_martians = 1

# Маршрутизатор не принимает редиректы и source routing, сам редиректы не шлёт
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1

# Лаба только IPv4: IPv6 на gw выключен (таблица inet всё равно дропает по политике)
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
